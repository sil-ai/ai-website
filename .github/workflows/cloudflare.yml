# Publishes the site to Cloudflare (Workers static assets; config in wrangler.jsonc).
# - Merge to master: updates the live Cloudflare copy.
# - Pull request: publishes a preview copy and posts its link on the PR.
# Needs two repo secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN  (Cloudflare token with "Workers Scripts: Edit")
#   CLOUDFLARE_ACCOUNT_ID
# Until both are set, this workflow skips itself instead of failing.
name: Cloudflare

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare secrets are set
        id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Cloudflare secrets not set yet; skipping." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 20
          cache: npm

      - name: Build the site
        if: steps.check.outputs.ready == 'true'
        run: |
          npm ci
          npm run build

      - name: Publish the live Cloudflare copy (master only)
        if: steps.check.outputs.ready == 'true' && github.event_name == 'push'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.158.0"
          command: deploy

      - name: Publish a preview copy (pull requests)
        id: preview
        if: steps.check.outputs.ready == 'true' && github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.158.0"
          command: versions upload --preview-alias pr-${{ github.event.pull_request.number }}

      - name: Post the preview link on the pull request
        if: steps.check.outputs.ready == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTPUT: ${{ steps.preview.outputs.command-output }}
        run: |
          URL=$(echo "$OUTPUT" | grep -oE 'https://pr-[a-z0-9-]+\.[a-z0-9.-]+\.workers\.dev' | head -1)
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body "Cloudflare preview: $URL"
